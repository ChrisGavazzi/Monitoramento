  - uuid: 45b91d14b21f488d8a194a810c2e52e2
    template: NOC - Website HTTPS
    name: NOC - Website HTTPS
    description: 'Customizações da NOC sobre o template oficial "Website certificate by Zabbix agent 2" (aninhado).

      NÃO editar o template oficial; customizações ficam aqui.

      - Web scenario "Disponibilidade HTTPS": SEM HTTP proxy (proxy = próprio site causou falso positivo em 2026-09).

      - Trigger nodata de 8h: o master Cert: Get tem "Discard unchanged with heartbeat 6h"; nodata menor que isso gera alarme falso.

      - Se o template oficial for atualizado para a versão LLD (7.4+), a key cert.not_after muda e o trigger nodata precisa ser ajustado.

      '
    templates:
    - name: Website certificate by Zabbix agent 2
    groups:
    - name: Templates/NOC
    httptests:
    - uuid: 80af81124d204bf58eeb39e0791c0f4e
      name: Disponibilidade HTTPS
      delay: 5m
      attempts: '2'
      steps:
      - name: GET
        url: https://{$CERT.WEBSITE.HOSTNAME}:{$CERT.WEBSITE.PORT}
        timeout: 15s
        status_codes: '200'
      tags:
      - tag: component
        value: availability
    tags: []
  - uuid: 6eff0805a1e84a07a50ed6d389ffb1ac
    template: NOC - WireGuard
    name: NOC - WireGuard
    description: 'Monitora os peers do WireGuard via UserParameter (script /usr/local/bin/zbx-wg.sh no host).

      Handshake: segundos desde o último handshake (-1 = nunca houve).

      Alerta só quando {$WG.ALERTA} = 1 no host (túnel do evento: deixar 0 fora das etapas).

      '
    groups:
    - name: Templates/NOC
    discovery_rules:
    - uuid: 3c5ac605e18b4799bbd92bec7abd3720
      name: 'WireGuard: descoberta de peers'
      key: wg.discovery
      delay: 10m
      lifetime: 7d
      item_prototypes:
      - uuid: a71b9844d57740688ca9b3e0e1a233f4
        name: 'WG {#WGIF} peer {#WGALLOWED}: tempo desde o último handshake'
        key: wg.handshake[{#WGIF},{#WGPEER}]
        delay: 1m
        value_type: FLOAT
        units: s
        tags:
        - tag: component
          value: wireguard
        trigger_prototypes:
        - uuid: ba853e4af8014b60be7df7d084f57116
          expression: '{$WG.ALERTA}=1 and (last(/NOC - WireGuard/wg.handshake[{#WGIF},{#WGPEER}])>{$WG.HANDSHAKE.MAX} or last(/NOC - WireGuard/wg.handshake[{#WGIF},{#WGPEER}])<0)'
          name: Túnel WireGuard {#WGIF} sem handshake (peer {#WGALLOWED})
          priority: HIGH
          description: O peer não faz handshake há mais de {$WG.HANDSHAKE.MAX} segundos. Com PersistentKeepalive ativo, o handshake se renova a cada ~2 min enquanto o túnel está de pé.
          tags:
          - tag: scope
            value: availability
      - uuid: 82a2c5d89adf4adf832158c6506b1951
        name: 'WG {#WGIF} peer {#WGALLOWED}: tráfego recebido'
        key: wg.rx[{#WGIF},{#WGPEER}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: wireguard
      - uuid: fd37c3af933d4af5aa02654d192655e6
        name: 'WG {#WGIF} peer {#WGALLOWED}: tráfego enviado'
        key: wg.tx[{#WGIF},{#WGPEER}]
        delay: 1m
        value_type: FLOAT
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: wireguard
    macros:
    - macro: '{$WG.ALERTA}'
      value: '1'
      description: 1 = alerta quando o túnel cai; 0 = não alerta (fora de evento)
    - macro: '{$WG.HANDSHAKE.MAX}'
      value: '300'
      description: Segundos sem handshake até alertar
    tags: []
