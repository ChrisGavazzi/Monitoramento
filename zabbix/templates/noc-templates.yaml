      type: DEPENDENT
      key: ovpn.cert.vencendo
      history: 30d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var j = JSON.parse(value), t = j.ts;

          return j.certificados.filter(function (c) { return c.tipo === ''usuario'' && !c.revogado && c.vence >= t && c.vence - t <= 15 * 86400; }).length;'
      master_item:
        key: vfs.file.contents[{$OVPN.ARQ}]
