      history: 30d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var j = JSON.parse(value), t = j.ts;

          return j.certificados.filter(function (c) { return c.tipo === ''usuario'' && !c.revogado && c.vence < t; }).length;'
      master_item:
        key: vfs.file.contents[{$OVPN.ARQ}]
      tags:
      - tag: component
        value: vpn
    - uuid: 809d9c8412b54355990846eac68058ac
      name: 'OpenVPN: usuários sem conexão há 45+ dias'
      type: DEPENDENT
      key: ovpn.inativos45
      history: 30d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var j = JSON.parse(value), t = j.ts;

          return j.usuarios.filter(function (u) { return !u.on && !u.desabilitado && u.ultima && t - u.ultima >= 45 * 86400; }).length;'
      master_item:
        key: vfs.file.contents[{$OVPN.ARQ}]
      tags:
