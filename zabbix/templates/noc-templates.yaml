    - name: Network Generic Device by SNMP
  - uuid: 9d621b64bef145919e8df6ed1780c395
    template: NOC - Controle de acesso
    name: NOC - Controle de acesso
    description: Controle de acesso. Ping + porta do serviço (padrão 80).
    groups:
    - name: Templates/NOC
    items:
    - uuid: 05395cb556f440859228af514a8b0517
      name: 'ICMP: disponível'
      type: SIMPLE
      key: icmpping[,3]
      delay: 1m
