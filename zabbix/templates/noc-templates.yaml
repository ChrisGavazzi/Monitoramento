zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: dd47fe0de349414d9edd934dd24bc4f8
    name: Templates/NOC
  templates:
  - uuid: fd7ce5a9790c4feea38d5db39eb38259
    template: NOC - Switch
    name: NOC - Switch
    description: Switches do site. Ping + SNMP genérico (portas, tráfego, erros).
    groups:
    - name: Templates/NOC
    items:
    - uuid: 18bae9606dac4c72b92ebfa76171afb3
      name: 'ICMP: disponível'
      type: SIMPLE
      key: icmpping[,3]
      delay: 30s
      history: 14d
      valuemap:
        name: NOC ICMP
      description: 1 = responde ao ping (3 pacotes).
      tags:
      - tag: component
        value: network
    - uuid: 3286a066773845798f0e9b19f7c61780
      name: 'ICMP: perda de pacotes'
      type: SIMPLE
      key: icmppingloss[,3]
      delay: 30s
      history: 14d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: network
    - uuid: 3dbe155b5e504d59b1a07d9ab6c65ca8
      name: 'Gateway do site (via túnel): disponível'
      type: SIMPLE
      key: icmpping[{$SITE.GW},3]
      delay: 30s
      history: 7d
      valuemap:
        name: NOC ICMP
      description: Ping ao gateway da rede deste equipamento no site ({$SITE.GW}). Se ele não responde, o problema é o túnel/roteador, e o alerta do equipamento fica suprimido.
      tags:
      - tag: component
        value: network
      - tag: component
        value: sentinela
    - uuid: e90dc138eeaa4e3cb5740e424ada11d5
      name: 'ICMP: tempo de resposta'
      type: SIMPLE
      key: icmppingsec[,3,,,,avg]
      delay: 30s
      history: 14d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: network
    macros:
    - macro: '{$SITE.GW}'
      value: ''
      description: Gateway da rede do equipamento no site (sentinela do túnel).
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Perda (%) por 5 min para alertar.
    tags:
    - tag: area
      value: rede
    - tag: tipo
      value: switch
    valuemaps:
    - uuid: f9482bbba1c144dca0c8ccb75da4f3e9
      name: NOC ICMP
      mappings:
      - value: '0'
        newvalue: Sem resposta
      - value: '1'
        newvalue: OK
    templates:
    - name: Network Generic Device by SNMP
  - uuid: 7e48f66dd4ae4db883ce9ba25ecf775a
    template: NOC - AP Grandstream GWN
    name: NOC - AP Grandstream GWN
    description: 'Access points Wi-Fi Grandstream GWN (gerência pelo GDMS/GWN Manager). Ping + SNMP v2c: uptime real, CPU, memória, rádios e porta de cabo. Clientes por AP: o SNMP não entrega (ver no GDMS). Community: macro global {$SNMP_COMMUNITY}.'
    groups:
    - name: Templates/NOC
    items:
    - uuid: 0483958b2f254145acd68ac148485de4
      name: 'ICMP: disponível'
      type: SIMPLE
      key: icmpping[,3]
      delay: 1m
      history: 14d
      valuemap:
        name: NOC ICMP
      description: 1 = responde ao ping (3 pacotes).
      tags:
      - tag: component
        value: network
    - uuid: 47487368930e4ed0a195b102aba210d7
      name: 'ICMP: perda de pacotes'
      type: SIMPLE
      key: icmppingloss[,3]
      delay: 1m
      history: 14d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: network
    - uuid: ab56691d7a9044f0a29f087ae193066a
      name: 'Gateway do site (via túnel): disponível'
      type: SIMPLE
      key: icmpping[{$SITE.GW},3]
      delay: 1m
      history: 7d
      valuemap:
        name: NOC ICMP
      description: Ping ao gateway da rede deste equipamento no site ({$SITE.GW}). Se ele não responde, o problema é o túnel/roteador, e o alerta do equipamento fica suprimido.
      tags:
      - tag: component
        value: network
      - tag: component
        value: sentinela
    - uuid: d31140f3148148ba82aab7a4f5d83058
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      history: 7d
      valuemap:
        name: zabbix.host.available
      description: 0 = sem resposta, 1 = ok, 2 = desconhecido. O mapa usa este item (nome igual ao dos switches).
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
    - uuid: e239232ab92a435490c1253be39d6ec5
      name: Uptime do AP
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.42397.1.1.2.6.0]
      key: gwn.uptime
      delay: 2m
      history: 14d
      units: uptime
      trends: '0'
      description: 'gwnDeviceUptime: tempo desde o último boot do AP. O sysUpTime NÃO serve: ele zera quando o serviço SNMP reinicia.'
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: d53de7ec5ab64681a32e9e9090b18a4d
      name: Modelo
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.42397.1.1.2.1.0]
      key: gwn.model
      delay: 1h
      history: 30d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 046108fb23ac4f4bb5a7836ef0efb673
      name: Firmware
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.42397.1.1.2.4.0]
      key: gwn.firmware
      delay: 1h
      history: 90d
      value_type: CHAR
      trends: '0'
      description: O AP manda o texto em hexadecimal com um zero no fim; o JavaScript converte.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var s = value.trim();

          if (/^([0-9A-Fa-f]{2}( |$))+$/.test(s)) { var o = ''''; s.split(/\s+/).forEach(function (h) { var c = parseInt(h, 16); if (c > 0) o += String.fromCharCode(c); }); return o; }

          return value.replace(/\u0000/g, '''');'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
    - uuid: 42fab280099d471ebf2d1b3fd26b0791
      name: 'CPU: uso'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.11.0]
      key: gwn.cpu.util
      delay: 2m
      history: 14d
      value_type: FLOAT
      units: '%'
      description: 100 - ssCpuIdle (UCD-SNMP).
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - return 100 - Number(value);
      tags:
      - tag: component
        value: cpu
    - uuid: 23ef423a6faf42ef81a353f535cb81a1
      name: 'Memória: total'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.5.0]
      key: gwn.mem.total
      delay: 1h
      history: 14d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: a2fac60c19e6411e8064267af0218f42
      name: 'Memória: livre'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.6.0]
      key: gwn.mem.free
      delay: 2m
      history: 14d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: b892bc2c2eb94512a579430840f5f166
      name: 'Memória: buffers'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.14.0]
      key: gwn.mem.buffer
      delay: 2m
      history: 14d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: b6614543da824551baec06e88b983a8d
      name: 'Memória: cache'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.15.0]
      key: gwn.mem.cached
      delay: 2m
      history: 14d
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: e10f27b7dfdc413cb0f71daad91236dd
      name: 'Memória: uso'
      type: CALCULATED
      key: gwn.mem.util
      delay: 2m
      history: 14d
      value_type: FLOAT
      units: '%'
      params: (last(//gwn.mem.total)-(last(//gwn.mem.free)+last(//gwn.mem.buffer)+last(//gwn.mem.cached)))/last(//gwn.mem.total)*100
      description: 'Mesma conta do template oficial "Linux by SNMP": total - (livre + buffers + cache).'
      tags:
      - tag: component
        value: memory
    macros:
    - macro: '{$SITE.GW}'
      value: ''
      description: Gateway da rede do equipamento no site (sentinela do túnel).
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Perda (%) por 5 min para alertar.
    - macro: '{$AP.SNMP.TIMEOUT}'
      value: 5m
      description: Tempo sem SNMP (com ping ok) para alertar.
    - macro: '{$AP.UPTIME.MIN}'
      value: 10m
      description: Uptime abaixo disso = "AP reiniciou".
    - macro: '{$AP.CPU.MAX}'
      value: '90'
      description: CPU (%) por 10 min para alertar.
    - macro: '{$AP.MEM.MAX}'
      value: '90'
      description: Memória (%) por 10 min para alertar.
    - macro: '{$AP.ETH.MIN.MBPS}'
      value: '1000'
      description: Velocidade mínima esperada da porta de cabo.
    - macro: '{$AP.IF.MATCH}'
      value: ^eth[0-9]+$
      description: Interfaces descobertas (só as físicas).
    tags:
    - tag: area
      value: wifi
    - tag: tipo
      value: ap
    valuemaps:
    - uuid: 5f02da165c5546c9bbbd49963691d1ff
      name: NOC ICMP
      mappings:
      - value: '0'
        newvalue: Sem resposta
      - value: '1'
        newvalue: OK
    - uuid: 340738afe160473b99e7c7327032bf46
      name: zabbix.host.available
      mappings:
      - value: '0'
        newvalue: sem resposta
      - value: '1'
        newvalue: ok
      - value: '2'
        newvalue: desconhecido
    - uuid: 173b3d5599c34ac698e7ac1d92f82823
      name: IF-MIB::ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
    discovery_rules:
    - uuid: e89ccff656f74c4d9f8f6d89ccae8580
      name: Rádios
      type: SNMP_AGENT
      snmp_oid: discovery[{#RADIO},1.3.6.1.4.1.42397.1.1.3.1.1.2]
      key: gwn.radio.discovery
      delay: 1h
      description: 'gwnRadioTable. No GWN7664: wifi0 = 2,4 GHz, wifi1 = 5 GHz.'
      item_prototypes:
      - uuid: 329d6c8ad2b44967af28ac09b364ad61
        name: 'Rádio {#RADIO}: estado'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.42397.1.1.3.1.1.3.{#SNMPINDEX}]
        key: gwn.radio.status[{#SNMPINDEX}]
        delay: 2m
        history: 14d
        description: 1 = ligado (único valor visto no teste). Qualquer outro valor = rádio desligado.
        tags:
        - tag: component
          value: wifi
        - tag: radio
          value: '{#RADIO}'
        trigger_prototypes:
        - uuid: 37634166c2124523b2c2b5cf1c3b5c31
          expression: last(/NOC - AP Grandstream GWN/gwn.radio.status[{#SNMPINDEX}])<>1
          name: Rádio {#RADIO} desligado
          event_name: '{HOST.NAME}: rádio {#RADIO} desligado'
          opdata: 'Estado: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: O rádio parou (ou foi desligado no GDMS). Os clientes daquela faixa caem para a outra ou para outro AP.
          dependencies:
          - name: Sem resposta ao ping
            expression: max(/NOC - AP Grandstream GWN/icmpping[,3],#3)=0 and last(/NOC - AP Grandstream GWN/icmpping[{$SITE.GW},3])=1
          tags:
          - tag: scope
            value: availability
      - uuid: 84f72865ddd54333bcd65f7262a3a261
        name: 'Rádio {#RADIO}: canal'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.42397.1.1.3.1.1.4.{#SNMPINDEX}]
        key: gwn.radio.channel[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        trends: '0'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: wifi
        - tag: radio
          value: '{#RADIO}'
      - uuid: 53ef2475e4e641f7a65711b554e6eeab
        name: 'Rádio {#RADIO}: potência'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.42397.1.1.3.1.1.5.{#SNMPINDEX}]
        key: gwn.radio.power[{#SNMPINDEX}]
        delay: 5m
        history: 30d
        units: dBm
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: wifi
        - tag: radio
          value: '{#RADIO}'
    - uuid: 2c5dd6a03c6742dbb8550a3ef07aafa7
      name: Portas de rede (cabo)
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2]
      key: gwn.eth.discovery
      delay: 1h
      description: Só as portas físicas (eth*). As outras interfaces do AP são pontes e SSIDs internos.
      filter:
        conditions:
        - macro: '{#IFNAME}'
          value: '{$AP.IF.MATCH}'
          formulaid: A
      item_prototypes:
      - uuid: 1fcb5caa039b48c58c9a2690ce502604
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: net.if.status[ifOperStatus.{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: '0'
        valuemap:
          name: IF-MIB::ifOperStatus
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: c956fa160f35436ba8dcd163c895ebc1
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]
        key: net.if.speed[ifHighSpeed.{#SNMPINDEX}]
        delay: 5m
        history: 14d
        trends: '0'
        units: bps
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: ce5956425ffa4b77a8087d014103a99e
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        delay: 1m
        history: 14d
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6226d603648749e5a9517d6b8155798f
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        delay: 1m
        history: 14d
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      trigger_prototypes:
      - uuid: e43a93c699624f1da879551ceac402ad
        name: Porta {#IFNAME} abaixo de {$AP.ETH.MIN.MBPS} Mbps
        expression: last(/NOC - AP Grandstream GWN/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<{$AP.ETH.MIN.MBPS}*1000000 and last(/NOC - AP Grandstream GWN/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/NOC - AP Grandstream GWN/net.if.status[ifOperStatus.{#SNMPINDEX}])=1
        event_name: '{HOST.NAME}: porta {#IFNAME} negociou {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Ligada, mas abaixo da velocidade esperada. Quase sempre cabo, conector ou porta do switch/PoE.
        dependencies:
        - name: Sem resposta ao ping
          expression: max(/NOC - AP Grandstream GWN/icmpping[,3],#3)=0 and last(/NOC - AP Grandstream GWN/icmpping[{$SITE.GW},3])=1
        tags:
        - tag: scope
          value: performance
  - uuid: 8d02192c344944f88af511fac0d4a2ba
