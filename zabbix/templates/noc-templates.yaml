  - uuid: a65d36017a144fd2878ef6e2f5dc7e80
    template: NOC - MikroTik WAN DHCP
    name: NOC - MikroTik WAN DHCP
    description: 'Link de internet atrás de um roteador da operadora, com IP por DHCP client na RB (ex.: Beta banda larga). Sem IP público para pingar da nuvem: o Zabbix confere, por SNMP, se a RB tem IP da faixa da operadora.'
    groups:
    - name: Templates/NOC
    items:
    - uuid: 7a67b2ff9aae43119399932be1fe40be
      name: Tabela de IPs da RB (bruto)
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.4.20.1.1]
      key: wan.dhcp.walk
      delay: 1m
      history: 1d
      value_type: TEXT
      trends: '0'
      description: 'IP-MIB ipAdEntAddr: todos os IPs atribuídos às interfaces da RB, inclusive o que o DHCP client recebe da operadora.'
      tags:
      - tag: component
        value: raw
    - uuid: 2dcfbf26af954e6f912ecb98348c48a5
      name: 'WAN {$WAN.DHCP.NOME}: DHCP client com IP'
      type: DEPENDENT
      key: wan.dhcp.ok
      delay: '0'
      history: 14d
      valuemap:
        name: NOC DHCP
      master_item:
        key: wan.dhcp.walk
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var p = ''{$WAN.DHCP.PREFIX}'';

          return value.indexOf(p) >= 0 ? 1 : 0;'
      description: '1 = a RB tem um IP da faixa {$WAN.DHCP.PREFIX} (lease do DHCP client ativo). 0 = sem IP: link de reserva sem conexão com o roteador da operadora.'
      tags:
      - tag: component
        value: network
      - tag: component
        value: wan
    - uuid: 9e9c1495f1484b33b7ed0242d7df39e9
      name: 'WAN {$WAN.DHCP.NOME}: IP recebido'
      type: DEPENDENT
      key: wan.dhcp.ip
      delay: '0'
      history: 14d
      value_type: CHAR
      trends: '0'
      master_item:
        key: wan.dhcp.walk
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var p = ''{$WAN.DHCP.PREFIX}'';

          var m = value.split(''\n'').filter(function (l) { return l.indexOf('': '' + p) >= 0; });

          return m.length ? m[0].split('': '').pop().trim() : ''sem IP'';'
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      tags:
      - tag: component
        value: wan
    macros:
    - macro: '{$WAN.DHCP.PREFIX}'
      value: 192.168.150.
      description: Início da faixa entregue pela operadora (com ponto no final).
    - macro: '{$WAN.DHCP.NOME}'
      value: BETA
      description: Nome do link nos alertas.
    tags:
    - tag: area
      value: rede
    - tag: tipo
      value: link
    valuemaps:
    - uuid: 28536593b3a14a089c21a4db12112829
      name: NOC DHCP
      mappings:
      - value: '0'
        newvalue: Sem IP
      - value: '1'
        newvalue: Com IP
