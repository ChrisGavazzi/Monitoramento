      name: Servidores OpenVPN
      type: DEPENDENT
      key: ovpn.srv.discovery
      master_item:
        key: vfs.file.contents[{$OVPN.ARQ}]
      lifetime: 7d
      lld_macro_paths:
      - lld_macro: '{#SRVID}'
        path: $.id
      - lld_macro: '{#SRVNOME}'
        path: $.nome
      - lld_macro: '{#DESAB}'
        path: $.desabilitado
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.servidores
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      filter:
        conditions:
        - macro: '{#DESAB}'
          value: ^true$
          operator: NOT_MATCHES_REGEX
          formulaid: A
      item_prototypes:
      - uuid: d6f0cc0ee98549f8941e4412e6bc2fd5
        name: 'OpenVPN {#SRVNOME}: no ar'
        type: DEPENDENT
        key: ovpn.srv.up[{#SRVID}]
        history: 30d
        master_item:
          key: vfs.file.contents[{$OVPN.ARQ}]
        valuemap:
          name: NOC VPN no ar
        tags:
        - tag: component
          value: vpn
        - tag: vpn
          value: '{#SRVNOME}'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.servidores[?(@.id == '{#SRVID}')].no_ar.first()
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''true'' || value === ''1'' ? 1 : 0;'
        trigger_prototypes:
        - uuid: 792df6c7cea040b3a93cd39a43b57f5a
          expression: max(/NOC - pfSense OpenVPN/ovpn.srv.up[{#SRVID}],#2)=0
          name: Servidor OpenVPN {#SRVNOME} parado
          event_name: '{HOST.NAME}: servidor OpenVPN {#SRVNOME} parado'
          priority: HIGH
          description: O serviço não está rodando (sem socket de gerência e sem conexões). Status → Services no pfSense.
          tags:
          - tag: component
            value: vpn
          - tag: scope
            value: availability
