    template: NOC - Link WAN
    name: NOC - Link WAN
    description: 'Link de internet visto do Zabbix da nuvem: ping ao IP público ({$LINK.IP}), ao gateway da operadora ({$LINK.GW}) e ao IP do túnel VPN ({$VPN.IP}). Gateway fora = operadora; só IP público fora = RB; só túnel fora = VPN.'
