    name: Evento/Agregados
  templates:
  - uuid: afd3ee261ae04300b7d08382871d65b3
    template: NOC Evento - Agregados
    name: NOC Evento - Agregados
    groups:
    - name: Templates/NOC Evento
    description: Indicadores agregados por categoria (aggregate calculations sobre o item de ping icmpping[,3] dos templates NOC Evento). Vincular SÓ ao host EVENTO-AGREGADOS. Câmeras individuais não vão ao Telegram (tag alerta=agregado); este template
      avisa a falha em massa.
    items:
    - uuid: 48b4eff6c43f4067a10c04d8b6c6d399
      name: 'Câmeras: total monitorado'
      type: CALCULATED
      key: agg.cam.total
      delay: 1m
      history: 14d
      value_type: FLOAT
      params: count(last_foreach(/*/icmpping[,3]?[group="Evento/CFTV/Cameras"]))
      description: Hosts com ping ativo no grupo Evento/CFTV/Cameras.
      tags:
      - tag: component
        value: agregado
      - tag: categoria
        value: cam
    - uuid: 296c128e650b484fbc440ea70c90bbaa
      name: 'Câmeras: fora do ar'
      type: CALCULATED
      key: agg.cam.down
      delay: 1m
      history: 14d
      value_type: FLOAT
      params: count(last_foreach(/*/icmpping[,3]?[group="Evento/CFTV/Cameras"]))-sum(last_foreach(/*/icmpping[,3]?[group="Evento/CFTV/Cameras"]))
      description: Total menos os que respondem ao ping (ping = 1/0).
      tags:
      - tag: component
        value: agregado
      - tag: categoria
        value: cam
    - uuid: 0a45e9acb8864c81be540e2b9f903dde
      name: 'Faciais: total monitorado'
      type: CALCULATED
      key: agg.fac.total
      delay: 1m
      history: 14d
      value_type: FLOAT
      params: count(last_foreach(/*/icmpping[,3]?[group="Evento/Acesso/Faciais"]))
      description: Hosts com ping ativo no grupo Evento/Acesso/Faciais.
      tags:
      - tag: component
