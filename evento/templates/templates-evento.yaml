    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: 'Latência média (s) em 5 min para alerta Warning. Rede local: 150 ms já é anormal.'
    - macro: '{$SVC.PORT}'
      value: '37777'
      description: Porta TCP do serviço principal do equipamento.
    - macro: '{$SVC.INTERVAL}'
      value: 1m
      description: Intervalo do teste de porta.
