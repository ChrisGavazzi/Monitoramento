        name: NOC ICMP
      description: 1 = responde ao ping, 0 = sem resposta (3 pacotes).
      tags:
      - tag: component
        value: network
    - uuid: 7fa07e4371d6430d9b1adde9a8fe8e1f
      name: 'ICMP: perda de pacotes'
      type: SIMPLE
      key: icmppingloss[,3]
      delay: '{$ICMP.INTERVAL}'
      history: 14d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: network
    - uuid: 9f0b067c495c4d8290743841b55797eb
      name: 'ICMP: tempo de resposta'
      type: SIMPLE
      key: icmppingsec[,3,,,,avg]
      delay: '{$ICMP.INTERVAL}'
      history: 14d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: network
    - uuid: 4759c35126714b44b074ad7230b85e55
      name: 'ICMP: variação da latência (jitter 5m)'
      type: CALCULATED
      key: link.jitter
      delay: 1m
      history: 14d
      value_type: FLOAT
      units: s
      params: stddevpop(//icmppingsec[,3,,,,avg],5m)
      description: 'Desvio padrão da latência média ao gateway nos últimos 5 min. Aproximação de jitter: cada coleta já é a média de 3 pacotes, então picos curtos ficam suavizados.'
      tags:
      - tag: component
        value: network
    tags:
    - tag: area
      value: rede
    - tag: tipo
      value: link
    macros:
    - macro: '{$ICMP.INTERVAL}'
      value: 15s
      description: 'Links: ping a cada 15s (poucos hosts; melhora perda e jitter).'
    - macro: '{$ICMP.LOSS.WARN}'
      value: '5'
      description: 'Perda (%) média em 5 min para Warning. Link de internet: 5% já derruba voz/vídeo.'
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.08'
      description: 'Latência média (s) ao gateway em 5 min. Primeiro salto acima de 80 ms = problema na última milha (exceto satélite: ajuste no host).'
    - macro: '{$LINK.JITTER.WARN}'
      value: '0.03'
      description: Jitter (s) por 10 min para Warning.
    valuemaps:
    - uuid: e8733b9033094b63b64710ce3145745f
      name: NOC ICMP
      mappings:
      - value: '0'
        newvalue: Sem resposta
      - value: '1'
        newvalue: OK
