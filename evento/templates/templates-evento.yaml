  - uuid: a541d557a4e6453fbddfd78637c45942
    template: NOC Evento - Link WAN
    name: NOC Evento - Link WAN
    description: 'Gateway da operadora de cada link de internet (host LINK-<OPERADORA>, IP = gateway do link no MikroTik). Mede a última milha: se o gateway não responde, o link caiu. NÃO prova que a internet
      da operadora está ok; para isso, rota /32 de um alvo externo saindo por este link no roteador e um segundo host ICMP para esse alvo.'
    groups:
    - name: Templates/NOC Evento
    items:
    - uuid: ede771034b4e461bac0ef483483b9ad2
      name: 'ICMP: disponível'
      type: SIMPLE
      key: icmpping[,3]
      delay: '{$ICMP.INTERVAL}'
