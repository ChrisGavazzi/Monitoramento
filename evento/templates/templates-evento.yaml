zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 9caa1c76621f4ca78d94e6f0e3a62492
    name: Templates/NOC Evento
  templates:
  - uuid: 1023ffccc8bc4a12a106edadaf72ef51
    template: NOC Evento - Camera IP
    name: NOC Evento - Camera IP
    description: 'Câmeras IP Intelbras (CAM*, F*, S*, LPR). Só ping: câmera não expõe saúde útil por SNMP.'
    groups:
    - name: Templates/NOC Evento
    items:
    - uuid: aa5b7fa69de743128580cddbcf330a0e
      name: 'ICMP: disponível'
      type: SIMPLE
      key: icmpping[,3]
      delay: '{$ICMP.INTERVAL}'
      history: 14d
      valuemap:
        name: NOC ICMP
      description: 1 = responde ao ping, 0 = sem resposta (3 pacotes).
      tags:
      - tag: component
        value: network
    - uuid: f8cd564a826c4d848ba03cafde9591a9
      name: 'ICMP: perda de pacotes'
      type: SIMPLE
      key: icmppingloss[,3]
      delay: '{$ICMP.INTERVAL}'
      history: 14d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: network
    - uuid: 859111e04716427caf251344594af0fd
      name: 'ICMP: tempo de resposta'
      type: SIMPLE
      key: icmppingsec[,3,,,,avg]
      delay: '{$ICMP.INTERVAL}'
      history: 14d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: network
    tags:
    - tag: area
      value: cftv
    - tag: tipo
      value: camera
    macros:
    - macro: '{$ICMP.INTERVAL}'
      value: 30s
      description: Intervalo do ping. Não usar menos de 30s (carga e histórico).
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
      description: Perda (%) média em 5 min para alerta Warning.
    - macro: '{$ICMP.RTT.WARN}'
      value: '0.15'
      description: 'Latência média (s) em 5 min para alerta Warning. Rede local: 150 ms já é anormal.'
    valuemaps:
    - uuid: f9eb3e7334144c37b99ce00d6e102818
      name: NOC ICMP
      mappings:
      - value: '0'
        newvalue: Sem resposta
      - value: '1'
        newvalue: OK
