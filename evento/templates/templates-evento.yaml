  triggers:
  - uuid: 53a8a89c741f4b4b820d64a52c5561ee
    expression: max(/NOC Evento - Camera IP/icmpping[,3],#3)=0
    name: Sem resposta ao ping
    event_name: '{HOST.NAME} sem resposta ao ping'
    priority: AVERAGE
